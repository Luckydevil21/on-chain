<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Chain Investigations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d1117;
    --panel: #151b23;
    --panel-alt: #1c232c;
    --line: #2a313c;
    --text: #e6edf3;
    --text-dim: #7d8590;
    --accent: #4f8cc9;
    --accent-dim: #2c4a63;
    --accent-bg: #142331;
    --flag: #e0666c;
    --flag-bg: #2a1416;
    --entity: #4fb3a3;
    --entity-bg: #12211f;
    --ok: #6bbd76;
    --warn: #d4a72c;
    --warn-bg: #241c0d;
    --radius: 8px;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    display: flex;
  }
  a { color: var(--accent); }
  code, .mono { font-family: var(--mono); }

  /* ---------- Layout ---------- */
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--line); padding: 20px 0;
    display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
  }
  .brand { padding: 0 20px 18px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .brand-mark { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }
  .brand-title { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .nav { flex: 1; padding: 4px 10px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius);
    color: var(--text-dim); cursor: pointer; font-size: 13.5px; font-weight: 500; user-select: none;
    border-left: 2px solid transparent;
  }
  .nav-item:hover { background: var(--panel-alt); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--text); border-left: 2px solid var(--accent); }
  .nav-icon { font-family: var(--mono); font-size: 12px; width: 18px; text-align: center; color: var(--text-dim); }
  .nav-item.active .nav-icon { color: var(--accent); }
  .sidebar-foot { padding: 12px 20px 0; border-top: 1px solid var(--line); }
  .conn-pill { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
  .conn-dot.ok { background: var(--ok); }
  .conn-dot.bad { background: var(--flag); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .topbar-title { font-size: 15px; font-weight: 600; }
  .topbar-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 1px; }
  .content { flex: 1; overflow-y: auto; padding: 28px; }
  .section { display: none; max-width: 980px; }
  .section.active { display: block; }

  /* ---------- Controls ---------- */
  .style-toggle { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .style-toggle button {
    border: none; background: transparent; color: var(--text-dim); font-family: var(--sans);
    font-size: 12.5px; font-weight: 600; padding: 7px 14px; cursor: pointer;
  }
  .style-toggle button.active { background: var(--accent); color: #04121c; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
  .field .hint { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
  input[type=text], input[type=password], input[type=number], textarea, select {
    width: 100%; background: var(--panel-alt); border: 1px solid var(--line); color: var(--text);
    padding: 9px 11px; border-radius: var(--radius); font-family: var(--mono); font-size: 13px;
  }
  select { font-family: var(--sans); }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .radio-row { display: flex; gap: 16px; }
  .radio-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); font-weight: 400; }

  button.btn {
    font-family: var(--sans); font-size: 13px; font-weight: 600; border: none; border-radius: var(--radius);
    padding: 9px 16px; cursor: pointer; background: var(--accent); color: #04121c;
  }
  button.btn:hover { filter: brightness(1.08); }
  button.btn.secondary { background: var(--panel-alt); color: var(--text); border: 1px solid var(--line); }
  button.btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 14px; font-size: 13.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }

  .result-box { margin-top: 18px; }
  .empty-state { color: var(--text-dim); font-size: 13px; padding: 18px 0; }
  .status-line { font-size: 12.5px; color: var(--text-dim); margin: 10px 0; }
  .status-line.error { color: var(--flag); }

  table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.data-table th { text-align: left; color: var(--text-dim); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  table.data-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
  table.data-table tr:last-child td { border-bottom: none; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; font-family: var(--sans); }
  .pill.flag { background: var(--flag-bg); color: var(--flag); }
  .pill.ok { background: var(--panel-alt); color: var(--ok); }
  .pill.entity { background: var(--entity-bg); color: var(--entity); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }

  /* ---------- Wallet-watch / result cards ---------- */
  .watch-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; background: var(--panel-alt); }
  .watch-card.alert { border-color: var(--flag); background: var(--flag-bg); }
  .watch-card .addr { font-family: var(--mono); font-size: 12.5px; }
  .watch-card .msg { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; }

  /* ---------- Trail diagram ---------- */
  .diagram-section-title { font-size: 13px; font-weight: 600; margin: 20px 0 10px; }
  .diagram-section-title.match { color: var(--flag); }
  .diagram-section-title.flagged { color: var(--warn); }
  .trail-reason { font-size: 11.5px; color: var(--text-dim); font-style: italic; margin-bottom: 6px; }
  .trail-row { margin-bottom: 20px; }
  .trail-flow { display: flex; align-items: center; flex-wrap: wrap; }
  .wbox {
    font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 9px 13px; border-radius: 8px;
    border: 1.5px solid #3d5a78; background: var(--panel-alt); text-align: center; min-width: 84px;
    position: relative;
  }
  .wbox::before {
    content: ""; position: absolute; top: -3px; left: -3px; width: 6px; height: 6px;
    border-radius: 1px; background: #3d5a78;
  }
  .wbox.root { border-color: var(--accent); background: var(--accent-bg); }
  .wbox.root::before { background: var(--accent); }
  .wbox.entity { border-color: var(--entity); background: var(--entity-bg); }
  .wbox.entity::before { background: var(--entity); }
  .wbox.flagged { border-color: var(--flag); background: var(--flag-bg); color: var(--flag); }
  .wbox.flagged::before { background: var(--flag); }
  .wbox.guess { border-style: dashed; border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
  .wbox.guess::before { background: var(--warn); }
  .warrow { display: flex; flex-direction: column; align-items: center; margin: 0 8px; min-width: 90px; }
  .warrow .line { width: 100%; height: 0; border-top: 2px solid var(--text-dim); position: relative; margin: 4px 0; }
  .warrow .line.heuristic { border-top: 2px dashed var(--warn); }
  .warrow .line::after {
    content: "▶"; position: absolute; right: -2px; top: -8px; font-size: 10px; color: var(--text-dim);
  }
  .warrow .line.heuristic::after { color: var(--warn); }
  .warrow .alabel { font-size: 10.5px; text-align: center; color: var(--text); font-family: var(--mono); }
  .warrow .adate { font-size: 10px; color: var(--text-dim); }
  .legend-table td { font-family: var(--mono); font-size: 11.5px; }
  .legend-table td.label { font-family: var(--sans); font-weight: 600; }
  .footnote { font-size: 11.5px; color: var(--text-dim); margin-top: 14px; }

  /* ---------- Hub diagram (victim collator) ---------- */
  .hub-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 20px 0; }
  .sender-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 820px; margin: 0 auto; }
  .sender-box { font-family: var(--mono); font-size: 12px; font-weight: 600; text-align: center; padding: 9px 13px; border-radius: 8px; border: 1.5px solid #3d5a78; background: var(--panel-alt); min-width: 110px; }
  .sender-box.entity { border-color: var(--entity); background: var(--entity-bg); }
  .sender-box .amt { font-size: 10.5px; color: var(--text-dim); font-weight: 400; margin-top: 3px; }
  .hub-arrow { color: var(--text-dim); font-size: 18px; }
  .hub-box { border: 1.5px solid var(--accent); background: var(--accent-bg); border-radius: 8px; padding: 11px 18px; font-family: var(--mono); font-weight: 700; font-size: 13px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <div class="brand-mark">CASE TOOLKIT</div>
    <div class="brand-title">On-Chain Investigations</div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="sidebar-foot">
    <div class="conn-pill"><span class="conn-dot" id="connDot"></span><span id="connLabel">Not connected</span></div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="sectionTitle">Wallet Watcher</div>
      <div class="topbar-sub" id="sectionSub">Check flagged wallets for recent activity</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div class="style-toggle" id="styleToggle">
        <button data-style="technical">🎓 Technical</button>
        <button data-style="simple">👤 Simple</button>
      </div>
      <button class="btn secondary" id="settingsBtn" style="font-size:12px; padding:7px 12px;">⚙ Connection</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
// ============================================================
// STATE
// ============================================================
const state = {
  apiBase: window.location.origin,
  apiKey: "",
  reportStyle: "technical",
  section: "wallet-watch",
};

const SECTIONS = [
  { id: "wallet-watch", icon: "◎", label: "Wallet Watcher", sub: "Check flagged wallets for recent activity" },
  { id: "victim-collate", icon: "◈", label: "Victim Collator", sub: "Who sent funds into a target wallet" },
  { id: "link-trace", icon: "⇢", label: "Link Tracer", sub: "Trace funds forward or backward, hop by hop" },
  { id: "address-scan", icon: "◔", label: "Address Watcher", sub: "Scan configured sources for new addresses" },
  { id: "case-watchlist", icon: "▤", label: "Case Watchlist", sub: "Shared list of flagged illicit wallets" },
  { id: "known-entities", icon: "▥", label: "Known Entities", sub: "Exchanges, mixers, and instant-swap services" },
];

// ============================================================
// API HELPER
// ============================================================
async function apiFetch(path, options = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
  if (state.apiKey) headers["X-API-Key"] = state.apiKey;
  const response = await fetch(state.apiBase + path, Object.assign({}, options, { headers }));
  let body;
  try { body = await response.json(); } catch (e) { body = null; }
  if (!response.ok) {
    const detail = (body && body.detail) ? body.detail : `HTTP ${response.status}`;
    throw new Error(detail);
  }
  return body;
}

function escapeHtml(text) {
  return String(text ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function formatFriendlyDate(isoLike) {
  // Input like "2026-05-06 15:28:40" (UTC, space-separated as returned by the API)
  const d = new Date(isoLike.replace(" ", "T") + "Z");
  if (isNaN(d.getTime())) return isoLike;
  const opts = { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: true, timeZone: "UTC" };
  return d.toLocaleString("en-GB", opts).replace(",", " at") + " UTC";
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// ============================================================
// NAV / LAYOUT
// ============================================================
function buildNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  for (const section of SECTIONS) {
    const item = el("div", "nav-item" + (section.id === state.section ? " active" : ""));
    item.innerHTML = `<span class="nav-icon">${section.icon}</span><span>${section.label}</span>`;
    item.onclick = () => switchSection(section.id);
    nav.appendChild(item);
  }
}

function switchSection(id) {
  state.section = id;
  buildNav();
  const meta = SECTIONS.find(s => s.id === id);
  document.getElementById("sectionTitle").textContent = meta.label;
  document.getElementById("sectionSub").textContent = meta.sub;
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById("section-" + id).classList.add("active");
  // These two sections show live server data - refresh it every time the
  // tab is opened, rather than relying on a stale load from page-init
  // (which may have happened before an API key was even set).
  if (id === "case-watchlist") loadCaseWatchlist();
  if (id === "known-entities") loadKnownEntities();
}

function updateConnStatus(ok) {
  document.getElementById("connDot").className = "conn-dot " + (ok === null ? "" : ok ? "ok" : "bad");
  document.getElementById("connLabel").textContent = ok === null ? "Not connected" : ok ? "Connected" : "Connection failed";
}

document.getElementById("styleToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.reportStyle = btn.dataset.style;
  refreshStyleToggle();
});
function refreshStyleToggle() {
  document.querySelectorAll("#styleToggle button").forEach(b => b.classList.toggle("active", b.dataset.style === state.reportStyle));
  // Re-render whatever's currently on screen using cached last results, so the toggle is instant.
  if (lastResults.linkTrace) renderLinkTraceResults(lastResults.linkTrace, lastResults.linkTraceMeta);
  if (lastResults.victimCollate) renderVictimResults(lastResults.victimCollate);
}

document.getElementById("settingsBtn").onclick = () => openSettingsModal();

// ============================================================
// SETTINGS MODAL (API base URL + key)
// ============================================================
function openSettingsModal() {
  const overlay = el("div");
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50;";
  overlay.innerHTML = `
    <div class="card" style="width:420px;">
      <h3>Connection</h3>
      <div class="field"><label>API base URL</label><input type="text" id="modalBaseUrl" value="${escapeHtml(state.apiBase)}"></div>
      <div class="field"><label>API key (X-API-Key)</label><input type="password" id="modalApiKey" value="${escapeHtml(state.apiKey)}">
        <div class="hint">Kept in memory for this browser tab only - never saved to disk.</div>
      </div>
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn secondary" id="modalCancel">Cancel</button>
        <button class="btn" id="modalSave">Save &amp; Test</button>
      </div>
      <div class="status-line" id="modalStatus"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#modalCancel").onclick = () => overlay.remove();
  overlay.querySelector("#modalSave").onclick = async () => {
    state.apiBase = overlay.querySelector("#modalBaseUrl").value.replace(/\/$/, "");
    state.apiKey = overlay.querySelector("#modalApiKey").value;
    const statusEl = overlay.querySelector("#modalStatus");
    statusEl.textContent = "Testing connection...";
    statusEl.className = "status-line";
    try {
      await apiFetch("/api/case-watchlist");
      updateConnStatus(true);
      overlay.remove();
      if (state.section === "case-watchlist") loadCaseWatchlist();
      if (state.section === "known-entities") loadKnownEntities();
    } catch (err) {
      updateConnStatus(false);
      statusEl.textContent = "Could not connect: " + err.message;
      statusEl.className = "status-line error";
    }
  };
}

// ============================================================
// SHARED: alias-building (mirrors link_tracer.py's build_friendly_aliases)
// ============================================================
function buildAliases(hopsFlat, rootWallet) {
  const aliases = {};
  aliases[rootWallet.toLowerCase()] = "Wallet Under Investigation";
  let letterIndex = 0;
  function nextLetter() {
    let index = letterIndex++ + 1;
    let letters = "";
    while (index > 0) {
      const remainder = (index - 1) % 26;
      letters = String.fromCharCode(65 + remainder) + letters;
      index = Math.floor((index - 1) / 26);
    }
    return letters;
  }
  for (const hop of hopsFlat) {
    for (const side of [["from_address", "from_known_entity"], ["to_address", "to_known_entity"]]) {
      const addr = hop[side[0]];
      const key = addr.toLowerCase();
      if (key in aliases) continue;
      const entity = hop[side[1]];
      aliases[key] = entity ? `${entity.name} (${entity.type})` : `Wallet ${nextLetter()}`;
    }
  }
  return aliases;
}

function flattenHops(paths) {
  const hops = [];
  for (const path of paths) for (const hop of path.hops) hops.push(hop);
  return hops;
}

// ============================================================
// WALLET WATCHER
// ============================================================
function renderWalletWatchSection() {
  const section = el("div", "section", "");
  section.id = "section-wallet-watch";
  section.innerHTML = `
    <div class="card">
      <h3>Wallets to check</h3>
      <div class="field">
        <label>Comma or newline separated (leave blank to use the shared watchlist)</label>
        <textarea id="wwWallets" placeholder="0xabc..., bc1q..., rDx..."></textarea>
      </div>
      <div class="field">
        <label>Lookback window (hours, optional)</label>
        <input type="number" id="wwLookback" placeholder="uses the server's default">
      </div>
      <button class="btn" id="wwRun">Check wallets</button>
    </div>
    <div class="status-line" id="wwStatus"></div>
    <div id="wwResults" class="result-box"></div>
  `;
  document.getElementById("content").appendChild(section);

  document.getElementById("wwRun").onclick = async () => {
    const raw = document.getElementById("wwWallets").value.trim();
    const wallets = raw ? raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean) : null;
    const lookbackRaw = document.getElementById("wwLookback").value.trim();
    const body = {};
    if (wallets) body.wallets = wallets;
    if (lookbackRaw) body.lookback_hours = parseInt(lookbackRaw, 10);

    const statusEl = document.getElementById("wwStatus");
    const resultsEl = document.getElementById("wwResults");
    statusEl.textContent = "Checking...";
    statusEl.className = "status-line";
    resultsEl.innerHTML = "";
    try {
      const results = await apiFetch("/api/wallet-watch", { method: "POST", body: JSON.stringify(body) });
      statusEl.textContent = `Checked ${results.length} wallet(s).`;
      renderWalletWatchResults(results, resultsEl);
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
      statusEl.className = "status-line error";
    }
  };
}

function renderWalletWatchResults(results, container) {
  container.innerHTML = "";
  if (!results.length) { container.innerHTML = `<div class="empty-state">No wallets checked.</div>`; return; }
  for (const r of results) {
    const card = el("div", "watch-card" + (r.alert ? " alert" : ""));
    let inner = `<div class="addr">${escapeHtml(r.address)}</div>`;
    if (!r.valid) {
      inner += `<div class="msg">${escapeHtml(r.message)}</div>`;
    } else if (r.alert) {
      inner += `<div class="msg"><span class="pill flag">MOVED FUNDS</span> ${escapeHtml(r.amount)}${r.counterparty ? " ↔ " + escapeHtml(r.counterparty) : ""} · ${escapeHtml(r.tx_time_utc)} UTC</div>`;
    } else {
      inner += `<div class="msg"><span class="pill ok">CLEAR</span> ${escapeHtml(r.message || "No recent activity.")}</div>`;
    }
    card.innerHTML = inner;
    container.appendChild(card);
  }
}

// ============================================================
// VICTIM COLLATOR
// ============================================================
const lastResults = { linkTrace: null, linkTraceMeta: null, victimCollate: null };

function renderVictimCollateSection() {
  const section = el("div", "section", "");
  section.id = "section-victim-collate";
  section.innerHTML = `
    <div class="card">
      <h3>Target wallet</h3>
      <div class="field"><input type="text" id="vcWallet" placeholder="Wallet to check for incoming senders"></div>
      <button class="btn" id="vcRun">Collate senders</button>
    </div>
    <div class="status-line" id="vcStatus"></div>
    <div id="vcResults" class="result-box"></div>
  `;
  document.getElementById("content").appendChild(section);

  document.getElementById("vcRun").onclick = async () => {
    const wallet = document.getElementById("vcWallet").value.trim();
    const statusEl = document.getElementById("vcStatus");
    const resultsEl = document.getElementById("vcResults");
    if (!wallet) { statusEl.textContent = "Enter a wallet address first."; statusEl.className = "status-line error"; return; }
    statusEl.textContent = "Collating...";
    statusEl.className = "status-line";
    resultsEl.innerHTML = "";
    try {
      const data = await apiFetch("/api/victim-collate", { method: "POST", body: JSON.stringify({ target_wallet: wallet }) });
      lastResults.victimCollate = data;
      statusEl.textContent = `${data.unique_senders} sender(s), ${data.total_received.toFixed(4)} ${data.currency} total.`;
      renderVictimResults(data);
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
      statusEl.className = "status-line error";
    }
  };
}

function renderVictimResults(data) {
  const container = document.getElementById("vcResults");
  container.innerHTML = "";
  if (!data.senders.length) { container.innerHTML = `<div class="empty-state">No incoming transactions found.</div>`; return; }

  const simple = state.reportStyle === "simple";
  let aliases = {};
  if (simple) {
    let letterIndex = 0;
    function nextLetter() {
      let index = letterIndex++ + 1, letters = "";
      while (index > 0) { const r = (index - 1) % 26; letters = String.fromCharCode(65 + r) + letters; index = Math.floor((index - 1) / 26); }
      return letters;
    }
    for (const s of data.senders) aliases[s.address] = s.known_entity ? `${s.known_entity.name} (${s.known_entity.type})` : `Sender ${nextLetter()}`;
  }

  const wrap = el("div");
  const grid = el("div", "sender-grid");
  for (const s of data.senders.slice(0, 10)) {
    const box = el("div", "sender-box" + (s.known_entity ? " entity" : ""));
    const label = simple ? aliases[s.address] : s.address;
    box.innerHTML = `${escapeHtml(label)}<div class="amt">${s.amount.toFixed(4)} ${escapeHtml(data.currency)}</div>`;
    grid.appendChild(box);
  }
  wrap.appendChild(grid);

  const hub = el("div", "hub-wrap");
  hub.innerHTML = `<div class="hub-arrow">▲</div><div class="hub-box">Wallet Under Investigation</div>`;
  wrap.appendChild(hub);

  if (data.senders.length > 10) wrap.appendChild(el("div", "footnote", `+${data.senders.length - 10} more sender(s) not shown - see Technical View / raw data for the complete list.`));

  if (simple) {
    const legendCard = el("div", "card");
    legendCard.innerHTML = `<h3>Key</h3><table class="legend-table"></table>`;
    const table = legendCard.querySelector("table");
    for (const [addr, label] of Object.entries(aliases)) {
      const row = el("tr"); row.innerHTML = `<td class="label">${escapeHtml(label)}</td><td>${escapeHtml(addr)}</td>`; table.appendChild(row);
    }
    wrap.appendChild(legendCard);
  } else {
    const table = el("table", "data-table");
    table.innerHTML = `<tr><th>Sender</th><th>Amount</th><th>Known entity</th></tr>` + data.senders.map(s =>
      `<tr><td>${escapeHtml(s.address)}</td><td>${s.amount.toFixed(6)} ${escapeHtml(data.currency)}</td><td>${s.known_entity ? escapeHtml(s.known_entity.name) : "-"}</td></tr>`
    ).join("");
    wrap.appendChild(table);
  }

  container.appendChild(wrap);
}

function renderLinkTraceSection() {
  const section = el("div", "section", "");
  section.id = "section-link-trace";
  section.innerHTML = `
    <div class="card">
      <h3>Trace parameters</h3>
      <div class="field"><label>Wallet</label><input type="text" id="ltWallet" placeholder="Victim wallet (forward) or wallet under investigation (backward)"></div>
      <div class="field"><label>Direction</label>
        <div class="radio-row">
          <label><input type="radio" name="ltDirection" value="forward" checked> Forward (follow money OUT)</label>
          <label><input type="radio" name="ltDirection" value="backward"> Backward (trace money IN)</label>
        </div>
      </div>
      <div class="field"><label>Extra target wallet(s) (optional, comma separated)</label><input type="text" id="ltTargets"></div>
      <div class="field"><label>Starting amount for amount-filtering (optional)</label><input type="text" id="ltAmount"></div>
      <div class="field"><label><input type="checkbox" id="ltIncludeWatchlist" checked style="width:auto; margin-right:6px;"> Include shared case watchlist as targets</label></div>
      <button class="btn" id="ltRun">Run trace</button>
    </div>
    <div class="status-line" id="ltStatus"></div>
    <div id="ltResults" class="result-box"></div>
  `;
  document.getElementById("content").appendChild(section);

  document.getElementById("ltRun").onclick = async () => {
    const wallet = document.getElementById("ltWallet").value.trim();
    const direction = document.querySelector('input[name="ltDirection"]:checked').value;
    const targetsRaw = document.getElementById("ltTargets").value.trim();
    const amountRaw = document.getElementById("ltAmount").value.trim();
    const includeWatchlist = document.getElementById("ltIncludeWatchlist").checked;
    const statusEl = document.getElementById("ltStatus");
    const resultsEl = document.getElementById("ltResults");
    if (!wallet) { statusEl.textContent = "Enter a wallet address first."; statusEl.className = "status-line error"; return; }

    const body = { wallet, direction, include_case_watchlist: includeWatchlist };
    if (targetsRaw) body.target_wallets = targetsRaw.split(",").map(s => s.trim()).filter(Boolean);
    if (amountRaw) body.starting_amount = parseFloat(amountRaw);

    statusEl.textContent = "Tracing... this can take a while.";
    statusEl.className = "status-line";
    resultsEl.innerHTML = "";
    try {
      const data = await apiFetch("/api/link-trace", { method: "POST", body: JSON.stringify(body) });
      lastResults.linkTrace = data;
      lastResults.linkTraceMeta = { wallet, direction };
      statusEl.textContent = `${data.addresses_visited} wallet(s) visited. ${data.matched_paths.length} direct link(s) found.`;
      renderLinkTraceResults(data, lastResults.linkTraceMeta);
    } catch (err) {
      statusEl.textContent = "Error: " + err.message;
      statusEl.className = "status-line error";
    }
  };
}

function renderLinkTraceResults(data, meta) {
  const container = document.getElementById("ltResults");
  container.innerHTML = "";
  const simple = state.reportStyle === "simple";

  const allPaths = [...data.matched_paths, ...data.flagged_end_paths.map(p => p), ...data.amount_filtered_paths.map(p => p)];
  if (!allPaths.length) {
    container.innerHTML = `<div class="empty-state">No on-chain activity found within the hop limit. This does not rule out a link - see the tool's documented limitations (exchanges, mixers, and cross-chain bridges all break a simple on-chain trail).</div>`;
    return;
  }

  const targetSet = new Set(); // we don't get the raw target list back, so flagged/matched styling below relies on server-provided known_entity + the fact matched_paths ARE the target hits

  let aliases = {};
  if (simple) aliases = buildAliases(flattenHops(allPaths), meta.wallet);

  function renderSwapLeads(path) {
    const candidates = path.swap_correlation_candidates;
    if (candidates === undefined) return; // not applicable to this path (not an instant_swap entity)

    if (!candidates.length) {
      container.appendChild(el("div", "trail-reason",
        "🔄 No plausible correlated deposit/payout found for this service within the configured time window and value tolerance."));
      return;
    }

    const best = candidates[0];
    const row = el("div", "trail-row");
    const pctMatch = Math.round(best.usd_match_ratio * 100);
    const timingWord = best.minutes_diff >= 0 ? "later" : "earlier";
    row.appendChild(el("div", "trail-reason",
      `🔄 POSSIBLE LEAD (not confirmed) - HEURISTIC, verify before relying on it: ` +
      `${pctMatch}% USD value match, ${Math.abs(best.minutes_diff).toFixed(1)} min ${timingWord}, on ${best.chain}.`));
    const flow = el("div", "trail-flow");
    flow.appendChild(makeBox("(swap service)", "entity"));
    flow.appendChild(makeArrow(best.amount, formatFriendlyDate(best.tx_time_utc), true));
    const destLabel = simple ? (aliases[best.counterparty.toLowerCase()] || best.counterparty) : best.counterparty;
    flow.appendChild(makeBox(destLabel, "guess"));
    row.appendChild(flow);
    container.appendChild(row);
    if (candidates.length > 1) {
      container.appendChild(el("div", "footnote", `+${candidates.length - 1} more candidate(s) for this lead - see Technical View / raw API response for the full list.`));
    }
  }

  function renderGroup(title, cls, paths) {
    if (!paths.length) return;
    container.appendChild(el("div", "diagram-section-title " + cls, title));
    for (const path of paths) {
      const row = el("div", "trail-row");
      if (path.reason) row.appendChild(el("div", "trail-reason", path.reason));
      const flow = el("div", "trail-flow");
      const rootLabel = simple ? aliases[path.hops[0].from_address.toLowerCase()] : path.hops[0].from_address;
      flow.appendChild(makeBox(rootLabel, "root"));
      path.hops.forEach((hop, i) => {
        const isLast = i === path.hops.length - 1;
        const isMatchTarget = cls === "match" && isLast;
        flow.appendChild(makeArrow(hop.amount, formatFriendlyDate(hop.tx_time_utc), false));
        let label = simple ? (aliases[hop.to_address.toLowerCase()] || hop.to_address) : hop.to_address;
        let boxCls = "";
        if (isMatchTarget) { boxCls = "flagged"; label = "🚩 " + label; }
        else if (hop.to_known_entity) { boxCls = "entity"; }
        flow.appendChild(makeBox(label, boxCls));
      });
      row.appendChild(flow);
      container.appendChild(row);
      renderSwapLeads(path);
    }
  }

  renderGroup("🚨 Direct link found", "match", data.matched_paths);
  renderGroup("🔶 Trails ending at a known/likely exchange", "flagged", data.flagged_end_paths);
  renderGroup("⚠️ Flagged for manual review (amount mismatch)", "flagged", data.amount_filtered_paths);

  if (simple) {
    const legendCard = el("div", "card");
    legendCard.innerHTML = `<h3>Key</h3><table class="legend-table"></table>`;
    const table = legendCard.querySelector("table");
    for (const [addr, label] of Object.entries(aliases)) {
      const row = el("tr"); row.innerHTML = `<td class="label">${escapeHtml(label)}</td><td>${escapeHtml(addr)}</td>`; table.appendChild(row);
    }
    container.appendChild(legendCard);
    container.appendChild(el("div", "footnote", "Full technical detail - transaction references, exact addresses, raw timestamps - is available in Technical View."));
  } else {
    const summaryCard = el("div", "card");
    summaryCard.innerHTML = `<h3>Clean summary</h3>`;
    const table = el("table", "data-table");
    table.innerHTML = `<tr><th>From</th><th>To</th><th>Amount</th><th>Time (UTC)</th><th>Verify</th></tr>` +
      data.clean_summary.map(r => `<tr><td>${escapeHtml(r.from)}</td><td>${escapeHtml(r.to)}</td><td>${escapeHtml(r.amount)}</td><td>${escapeHtml(r.tx_time_utc)}</td><td><a href="${r.verify_url}" target="_blank">view</a></td></tr>`).join("");
    summaryCard.appendChild(table);
    container.appendChild(summaryCard);
  }
}

function makeBox(label, cls) {
  const box = el("div", "wbox" + (cls ? " " + cls : ""));
  box.textContent = label;
  return box;
}
function makeArrow(amount, dateLabel, heuristic) {
  const wrap = el("div", "warrow");
  wrap.innerHTML = `<div class="alabel">${escapeHtml(amount)}</div><div class="line${heuristic ? " heuristic" : ""}"></div><div class="adate">${escapeHtml(dateLabel)}</div>`;
  return wrap;
}

// ============================================================
// ADDRESS SCAN
// ============================================================
function renderAddressScanSection() {
  const section = el("div", "section", "");
  section.id = "section-address-scan";
  section.innerHTML = `
    <div class="card">
      <h3>Scan configured sources</h3>
      <div class="field hint" style="margin-bottom:14px;">Scans the RSS/Telegram/X sources configured in crypto_address_watcher.py. Runs in the background - this can take a while.</div>
      <button class="btn" id="asStart">Start scan</button>
      <button class="btn secondary" id="asRefresh" style="margin-left:8px;">Check latest result</button>
    </div>
    <div class="status-line" id="asStatus"></div>
    <div id="asResults" class="result-box"></div>
  `;
  document.getElementById("content").appendChild(section);

  document.getElementById("asStart").onclick = async () => {
    const statusEl = document.getElementById("asStatus");
    try {
      const r = await apiFetch("/api/address-scan/start", { method: "POST" });
      statusEl.textContent = r.message;
      pollAddressScan();
    } catch (err) { statusEl.textContent = "Error: " + err.message; statusEl.className = "status-line error"; }
  };
  document.getElementById("asRefresh").onclick = () => fetchAddressScanLatest();
}

let addressScanPollHandle = null;
function pollAddressScan() {
  if (addressScanPollHandle) clearInterval(addressScanPollHandle);
  addressScanPollHandle = setInterval(async () => {
    const data = await fetchAddressScanLatest();
    if (data && data.status !== "running") clearInterval(addressScanPollHandle);
  }, 4000);
}
async function fetchAddressScanLatest() {
  const statusEl = document.getElementById("asStatus");
  const resultsEl = document.getElementById("asResults");
  try {
    const data = await apiFetch("/api/address-scan/latest");
    statusEl.textContent = `Status: ${data.status}` + (data.completed_at ? ` · completed ${data.completed_at}` : "");
    statusEl.className = "status-line";
    resultsEl.innerHTML = "";
    if (data.result && data.result.findings) {
      const table = el("table", "data-table");
      table.innerHTML = `<tr><th>Address</th><th>Chain</th><th>New?</th><th>First source</th></tr>` +
        data.result.findings.map(f => `<tr><td>${escapeHtml(f.address)}</td><td>${escapeHtml(f.coin_type)}</td><td>${f.is_new ? '<span class="pill flag">NEW</span>' : '<span class="pill ok">known</span>'}</td><td>${escapeHtml((f.sightings[0] || {}).source || "")}</td></tr>`).join("");
      resultsEl.appendChild(table);
    } else if (data.result && data.result.error) {
      resultsEl.innerHTML = `<div class="status-line error">${escapeHtml(data.result.error)}</div>`;
    } else {
      resultsEl.innerHTML = `<div class="empty-state">No scan results yet.</div>`;
    }
    return data;
  } catch (err) {
    statusEl.textContent = "Error: " + err.message; statusEl.className = "status-line error";
    return null;
  }
}

function renderCaseWatchlistSection() {
  const section = el("div", "section", "");
  section.id = "section-case-watchlist";
  section.innerHTML = `
    <div class="card">
      <h3>Add a wallet</h3>
      <div class="field"><label>Address</label><input type="text" id="cwAddress"></div>
      <div class="field"><label>Source (optional)</label><input type="text" id="cwSource"></div>
      <div class="field"><label>Context (optional)</label><input type="text" id="cwContext"></div>
      <button class="btn" id="cwAdd">Add to watchlist</button>
    </div>
    <div class="status-line" id="cwStatus"></div>
    <div class="card"><h3>Shared case watchlist</h3><div id="cwList"></div></div>
  `;
  document.getElementById("content").appendChild(section);

  document.getElementById("cwAdd").onclick = async () => {
    const address = document.getElementById("cwAddress").value.trim();
    const source = document.getElementById("cwSource").value.trim();
    const context = document.getElementById("cwContext").value.trim();
    const statusEl = document.getElementById("cwStatus");
    if (!address) { statusEl.textContent = "Enter an address first."; statusEl.className = "status-line error"; return; }
    try {
      const r = await apiFetch("/api/case-watchlist", { method: "POST", body: JSON.stringify({ address, source, context }) });
      statusEl.textContent = r.added ? "Added." : (r.message || "Already on the watchlist.");
      statusEl.className = "status-line";
      document.getElementById("cwAddress").value = "";
      loadCaseWatchlist();
    } catch (err) { statusEl.textContent = "Error: " + err.message; statusEl.className = "status-line error"; }
  };
}
async function loadCaseWatchlist() {
  const listEl = document.getElementById("cwList");
  if (!listEl) return;
  try {
    const entries = await apiFetch("/api/case-watchlist");
    listEl.innerHTML = "";
    if (!entries.length) { listEl.innerHTML = `<div class="empty-state">No addresses on the shared watchlist yet.</div>`; return; }
    const table = el("table", "data-table");
    table.innerHTML = `<tr><th>Address</th><th>Chain</th><th>First seen</th><th>Source</th><th></th></tr>` + entries.map(e =>
      `<tr><td>${escapeHtml(e.address)}</td><td>${escapeHtml(e.chain)}</td><td>${escapeHtml(e.first_seen_utc)}</td><td>${escapeHtml(e.source || "")}</td>
       <td><button class="btn secondary" style="padding:4px 9px; font-size:11px;" onclick="deleteCaseWatchlistEntry('${escapeHtml(e.address)}')">Remove</button></td></tr>`
    ).join("");
    listEl.appendChild(table);
  } catch (err) {
    listEl.innerHTML = `<div class="status-line error">Error: ${escapeHtml(err.message)}</div>`;
  }
}
async function deleteCaseWatchlistEntry(address) {
  await apiFetch("/api/case-watchlist/" + encodeURIComponent(address), { method: "DELETE" });
  loadCaseWatchlist();
}

      <div class="field"><label>Name</label><input type="text" id="keName" placeholder="e.g. ChangeNOW"></div>
      <div class="field"><label>Type</label>
        <select id="keType">
          <option value="exchange">exchange</option>
          <option value="mixer">mixer</option>
          <option value="instant_swap">instant_swap (no-KYC swap service - enables swap correlation)</option>
        </select>

    </div>
    <div class="status-line" id="keStatus"></div>
    <div class="card"><h3>Known entities</h3><div id="keList"></div></div>
  `;

  document.getElementById("keAdd").onclick = async () => {
    const address = document.getElementById("keAddress").value.trim();

    const type = document.getElementById("keType").value;
    const statusEl = document.getElementById("keStatus");

      statusEl.textContent = "Added.";
      statusEl.className = "status-line";
      document.getElementById("keAddress").value = ""; document.getElementById("keName").value = "";
      loadKnownEntities();

}
async function loadKnownEntities() {
  const listEl = document.getElementById("keList");
  if (!listEl) return;
  try {
    const entries = await apiFetch("/api/known-entities");
    listEl.innerHTML = "";
    if (!entries.length) { listEl.innerHTML = `<div class="empty-state">No known entities yet.</div>`; return; }
    const table = el("table", "data-table");
    table.innerHTML = `<tr><th>Address</th><th>Name</th><th>Type</th><th></th></tr>` + entries.map(e =>
      `<tr><td>${escapeHtml(e.address)}</td><td>${escapeHtml(e.name)}</td><td><span class="pill ${e.type === 'instant_swap' ? 'entity' : e.type === 'mixer' ? 'flag' : 'warn'}">${escapeHtml(e.type)}</span></td>

async function deleteKnownEntity(address) {
  await apiFetch("/api/known-entities/" + encodeURIComponent(address), { method: "DELETE" });
  loadKnownEntities();
}
