# ====================================================================
# RENDER BLUEPRINT (FREE TIER)
# ====================================================================
# What this is: a one-file description of how to deploy this whole
# toolkit on Render. Push this repo (with this file at the root) to
# GitHub/GitLab/Bitbucket, then in the Render Dashboard:
#     New + -> Blueprint -> select this repo
# Render reads this file and sets up the web service and prompts you
# for the secret environment variables below - no manual "Build
# Command"/"Start Command" typing needed.
#
# IMPORTANT - THIS IS THE FREE VERSION, READ THIS FIRST:
# Free-tier Render services CANNOT attach a Persistent Disk, so there
# is no disk in this file, and this app's shared case_watchlist.json
# and known_entities.json will be WIPED every time the service
# redeploys, restarts, OR spins down from inactivity (which happens
# after just 15 minutes on the free tier). Verify current Render
# pricing/limits at render.com/pricing before relying on this, since
# details change.
#
# In practice this means: anything you add to the Case Watchlist or
# Known Entities tabs will likely be gone the next time you open the
# app after a short break. Fine for testing the tool out; NOT fine
# for real case work you need to keep. If/when you're ready to keep
# real data persistently, switch "plan: free" below to "plan:
# starter" (a paid tier), add a "disk:" section back mounting a
# Persistent Disk, and set TOOLKIT_DATA_DIR to that mount path - ask
# for this and it can be added back in a minute.
#
# AFTER YOUR FIRST DEPLOY: Render will have assigned you a URL like
# https://on-chain-investigations-toolkit-xxxx.onrender.com - copy
# that, then go to your service's Environment tab and set
# TOOLKIT_ALLOWED_ORIGINS to that exact URL (see the envVars below -
# it's left blank on purpose since Render can't know this URL before
# the first deploy happens).
# ====================================================================

services:
  - type: web
    name: on-chain-investigations-toolkit
    runtime: python
    plan: free
    region: oregon                # change to whichever Render region is closest to you
    rootDir: Blockchain-tool-new   # your actual files live in this subfolder of the repo
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api_server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # You'll be prompted to fill these in during Blueprint setup in
      # the Render Dashboard - they are never stored in this file or
      # committed to your repo.
      - key: TOOLKIT_API_KEY
        sync: false
      - key: ETHERSCAN_API_KEY
        sync: false
      # Optional - raises TronGrid's rate limit for USDT-TRC20 (Tron)
      # lookups. Works fine without one for occasional/light use -
      # leave blank in the prompt if you don't need this yet.
      - key: TRON_API_KEY
        sync: false
      # Optional - enables AI-assisted report drafting/pattern
      # description on Link Tracer results. Free, no credit card
      # required (console.groq.com) - leave blank to skip.
      - key: GROQ_API_KEY
        sync: false
      - key: TOOLKIT_ALLOWED_ORIGINS
        sync: false            # set this to your https://...onrender.com URL AFTER the first deploy
      # Creates your first admin login account on startup - required to
      # sign in to the web app at all. See auth.py for details.
      - key: TOOLKIT_ADMIN_USERNAME
        sync: false
      - key: TOOLKIT_ADMIN_PASSWORD
        sync: false
      # Signs login sessions - a DIFFERENT long random string from
      # TOOLKIT_API_KEY. Without this, everyone gets logged out on every
      # restart/redeploy (a temporary one is generated each time).
      - key: TOOLKIT_JWT_SECRET
        sync: false
      # ---- Optional: "forgot password" emails. Leave every one of
      # these blank in the Render prompt if you don't need this yet -
      # forgot-password requests are still accepted either way, they
      # just won't actually send an email until these are set (see
      # email_sender.py). Works with any standard SMTP provider -
      # Gmail (with an app password), SendGrid, Mailgun, Amazon SES,
      # Resend, etc.
      - key: TOOLKIT_ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: TOOLKIT_BASE_URL
        sync: false            # set this to your https://...onrender.com URL AFTER the first deploy - used to build reset-password links
      # Pinned to a stable, well-established version - Render's current
      # default (3.14.3, as of Feb 2026) is new enough that some
      # dependencies here (pandas especially) may not have prebuilt
      # wheels for it yet, which would cause a slower/failing build.
      - key: PYTHON_VERSION
        value: 3.12.7
      # No TOOLKIT_DATA_DIR here on purpose - there's no persistent
      # disk on the free tier to point it at, so the app just falls
      # back to its own (ephemeral) folder either way.
